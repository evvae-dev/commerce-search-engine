name: commerce-search-demo
services:
  elasticsearch:
    build:
      context: .
      dockerfile: docker/elasticsearch.Dockerfile
    environment:
      cluster.name: commerce-search-demo
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:19200:9200"
    volumes:
      - demo-elasticsearch:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
volumes:
  demo-elasticsearch:
